<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nsele - Serre Connectée</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Styles custom -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div>
                <p class="eyebrow">Nsele</p>
                <h2>Serre connectée</h2>
            </div>
            <nav>
                <a href="/" style="text-decoration: underline; color: white;">Dashboard</a>
                <a href="/settings">Paramètres</a>
            </nav>
        </header>

        <main>
            <!-- Greenhouse selection bar -->
            <div style="margin-bottom: 24px;">
                <div id="greenhouse-bar" class="greenhouse-bar">
                    <!-- Rempli dynamiquement -->
                    <div class="gh-item">Chargement...</div>
                </div>
            </div>

            <!-- Bento Dashboard -->
            <div id="dashboard-content" class="bento-dashboard" style="display: none;">
                
                <!-- Colonne Gauche : Titre, Culture et Graphique -->
                <div class="bento-left">
                    <div class="hero">
                        <h2 id="gh-title" style="margin: 0 0 8px;">Serre 1</h2>
                        <p class="subtle" style="margin: 0;">Culture actuelle: <span id="gh-culture">--</span></p>
                    </div>
                    
                    <div class="card chart-card" style="height: 100%; min-height: 400px; display: flex; flex-direction: column;">
                        <h3 style="margin-top: 0; margin-bottom: 16px;">Évolution Globale (Moyenne)</h3>
                        <div style="position: relative; flex-grow: 1; min-height: 300px;">
                            <canvas id="sensorChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- Colonne Droite : Les 4 Compartiments -->
                <div class="bento-right">
                    <div class="compartments-grid" id="compartments-container">
                        <!-- Rempli dynamiquement -->
                    </div>
                </div>

            </div>

            <div id="loading-card" class="page-card">Chargement des données en cours...</div>
        </main>
    </div>

    <!-- Script Dashboard -->
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
